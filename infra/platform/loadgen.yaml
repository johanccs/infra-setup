apiVersion: v1
kind: Namespace
metadata:
  name: loadgen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: loadgen
spec:
  replicas: 1
  selector: 
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.22.0
          command: ["sh", "-c"]
          args:
            - |
              API=http://todo-api.todo.svc.cluster.local:8000
              while true; do
                for i in 1 2 3 4 5 6 7 8 9; do
                  curl -s -o /dev/null --max-time 5 "$API/api/todos"
                  curl -s -o /dev/null --max-time 5 "$API/api/info"
                  sleep 0.2
                done
                curl -s -o /dev/null --max-time 5 -X POST \
                  -H "Content-Type: application/json" \
                  -d '{"title":"from loadgen"}' "$API/api/todos"
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
