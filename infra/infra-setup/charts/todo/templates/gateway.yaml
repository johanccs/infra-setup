apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: todo
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo
spec:
  parentRefs:
    - name: todo
      sectionName: http
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: todo-api
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: todo-ui
          port: 80 