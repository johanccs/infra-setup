apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector: 
    matchLabels: { app: todo-api }
  template:
    metadata:
      labels: { app: todo-api }
    spec:
      containers:
        - name: api
          image: "{{ .Values.registry }}/todo-api:{{ .Values.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: {{ .Values.tag | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: todo-db, key: password }
            - name: ConnectionStrings__Todos
              value: "Host=todo-db;Database=todo;Username=todo;Password=$(DB_PASSWORD)"
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }

--- 

apiVersion: v1
kind: Service
metadata:
  name: todo-api
spec:
  selector: { app: todo-api }
  ports:
    - port: 8080
      targetPort: 8080