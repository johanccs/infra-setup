<style>
.bk-state { font: 500 12px/1 var(--font-mono); color: var(--muted); padding: 0 6px; white-space: nowrap; cursor: default; }
.bk-state::before { content: "●"; color: var(--ok); margin-right: 5px; }
.bk-state.saving::before { color: var(--accent); }
.bk-state.off::before { color: var(--warn); }
@media (max-width: 700px) { .bk-state .t { display: none; } }
</style>
<script>
// The database is where notes, bookmarks, your place and ticked steps are kept. Every change is sent to server.js, which
// stores it in a SQLite file (data/tutorial.db), at once and not after a delay. localStorage in this browser is only a
// cache that the page reads from: it is what makes the page instant and lets it work while the server is off. When a page
// opens, the newer copy wins, so a new browser, or one whose site data was cleared, gets everything back from the
// database. A browser that never synced before keeps its own notes and ticks and adds the server's (nothing is dropped).
// If the server cannot be reached the badge says "Not saved" and the change is sent as soon as it can be.
(function () {
  if (!/^https?:$/.test(location.protocol) || !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  var PAGE = location.pathname.split('/').pop() || 'code-to-cluster-tutorial.html';
  var KEYS = { notes: 'tutorial-notes:' + PAGE, bookmarks: 'tutorial-bookmarks:' + PAGE, pos: 'tutorial-pos:' + PAGE, done: PAGE.replace(/\.html$/, '') + '-done' };
  var TSKEY = 'tutorial-sync-ts:' + PAGE;                       // when each item last changed in this browser
  var ls, rawSet = Storage.prototype.setItem, rawRemove = Storage.prototype.removeItem;
  try { ls = window.localStorage; ls.getItem('x'); } catch (e) { return; }
  var ts = {}; try { ts = JSON.parse(ls.getItem(TSKEY) || '{}') || {}; } catch (e) { ts = {}; }
  var dirty = {}, timer = null, state = 'off', lastOk = 0;
  function shortOf(k) { for (var s in KEYS) if (KEYS[s] === k) return s; return null; }
  function setTs(s, t) { ts[s] = t; try { rawSet.call(ls, TSKEY, JSON.stringify(ts)); } catch (e) {} }
  function put(s, v) { if (v === null) rawRemove.call(ls, KEYS[s]); else rawSet.call(ls, KEYS[s], v); }

  // Combine two copies of something that was never synced before, so neither side loses anything.
  function union(s, a, b) {
    try {
      var A = JSON.parse(a), B = JSON.parse(b);
      if (s === 'done') { for (var k in B) if (!(k in A)) A[k] = B[k]; return JSON.stringify(A); }
      if (s === 'notes' || s === 'bookmarks') {
        var seen = {}; A.forEach(function (x) { seen[x.id] = 1; });
        B.forEach(function (x) { if (!seen[x.id]) A.push(x); });
        return JSON.stringify(A.sort(function (x, y) { return (x.ts || 0) - (y.ts || 0); }));
      }
    } catch (e) {}
    return b;                                                    // "where you stopped": the server's copy
  }

  // Restore before the page's own scripts read localStorage. A synchronous request is fine: the server is on this machine.
  var srv = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/state?page=' + encodeURIComponent(PAGE), false);
    x.setRequestHeader('x-tutorial', '1');
    x.send();
    if (x.status === 200) { srv = JSON.parse(x.responseText).state || {}; state = 'ok'; lastOk = Date.now(); }
    else if (x.status === 503) state = 'none';
  } catch (e) {}
  if (srv) Object.keys(KEYS).forEach(function (s) {
    var remote = srv[s], lv = ls.getItem(KEYS[s]), lt = ts[s] || 0;
    if (!remote) { if (lv !== null) { dirty[s] = true; if (!lt) setTs(s, Date.now()); } return; }
    if (!lt && lv !== null && lv !== remote.value) { put(s, union(s, lv, remote.value)); setTs(s, Date.now()); dirty[s] = true; return; }
    if (remote.updated > lt || lv === null && remote.value !== null) { put(s, remote.value); setTs(s, remote.updated); }
    else if (lt > remote.updated) dirty[s] = true;
  });

  // Send every later change.
  function changed(k) { var s = shortOf(k); if (!s || state === 'none') return; setTs(s, Date.now()); dirty[s] = true; schedule(0); }
  Storage.prototype.setItem = function (k, v) { rawSet.call(this, k, v); if (this === ls) changed(k); };
  Storage.prototype.removeItem = function (k) { rawRemove.call(this, k); if (this === ls) changed(k); };
  function schedule(ms) { clearTimeout(timer); timer = setTimeout(push, ms); if (state === 'ok') { state = 'saving'; show(); } }
  function push() {
    timer = null;
    var keys = Object.keys(dirty); dirty = {};
    if (!keys.length) { if (state === 'saving') { state = 'ok'; show(); } return; }
    Promise.all(keys.map(function (s) {
      return fetch('/api/state', { method: 'PUT', keepalive: true, headers: { 'content-type': 'application/json', 'x-tutorial': '1' },
        body: JSON.stringify({ page: PAGE, key: s, value: ls.getItem(KEYS[s]), updated: ts[s] || Date.now() }) })
        .then(function (r) { if (r.status === 503) { state = 'none'; return; } if (!r.ok) throw new Error(String(r.status)); });
    })).then(function () { if (state !== 'none') { state = 'ok'; lastOk = Date.now(); } show(); }, function () {
      keys.forEach(function (s) { dirty[s] = true; }); state = 'off'; show(); schedule(5000);
    });
  }
  addEventListener('pagehide', function () { if (Object.keys(dirty).length) push(); });
  if (Object.keys(dirty).length) schedule(300);

  // The small status next to the "done" counter.
  function show() {
    var el = document.getElementById('backup-state'); if (!el) return;
    el.hidden = false;
    var txt = { ok: 'Saved', saving: 'Saving…', off: 'Not saved', none: 'Not saved' }[state];
    el.className = 'bk-state' + (state === 'ok' ? '' : state === 'saving' ? ' saving' : ' off');
    el.innerHTML = '<span class="t"></span>'; el.firstChild.textContent = txt;
    el.title = state === 'ok' ? 'Your notes, bookmarks, place and ticks are saved in the database, data/tutorial.db (last saved ' + new Date(lastOk).toLocaleTimeString() + ').'
      : state === 'saving' ? 'Saving your latest change to the database, data/tutorial.db.'
      : state === 'none' ? 'The tutorial server has no SQLite support (it needs Node.js 22.13 or newer), so nothing can be saved to the database. Your changes are kept in this browser only.'
      : 'The tutorial server is not answering, so your latest change is NOT in the database yet. It is kept in this browser and is sent as soon as the server is back. Do not clear this browser\'s site data until the badge says Saved.';
  }
  document.addEventListener('DOMContentLoaded', show);
  window.__backup = { state: function () { return state; } };
})();
</script>
