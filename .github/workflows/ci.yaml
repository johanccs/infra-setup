name: ci

on:
  push:
    branches: [main]
    paths:
      - "src/api/**"
      - "src/ui/**"
      - "infra/**"
      - .github/workflows/ci.yaml

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Get the code
        uses: actions/checkout@v6
      
      - name: Work out the image names
        run: |
          echo "REGISTRY=docker.io/${DOCKERHUB_USERNAME,,}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      
      