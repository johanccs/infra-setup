apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels: { app: todo-ui }
  template:
    metadata:
      labels: { app: todo-ui }
    spec:
     containers:
      - name: ui
        image: "{{ .Values.registry }}/todo-ui:{{ .Values.tag }}"
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet: { path: /, port: 8080 }
        resources:
          requests: { cpu: 25m, memory: 32Mi }
          limits: { memory: 128Mi }

---

apiVersion: v1
kind: Service
metadata:
  name: todo-ui
spec:
  selector: { app: todo-ui }
  ports:
    - port: 80
      targetPort: 8080